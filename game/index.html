<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#B9DA9C" />
  <title>Nico's City</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div id="left"><div id="money" class="chip">$20</div><div id="boost" class="chip" hidden></div><button id="job" class="chip" type="button" hidden></button><div id="goal" class="chip" hidden></div><div id="stats" class="chip"><span id="fps">-- fps</span> · <span id="people">1 person</span></div></div>
    <div id="buttons">
      <button id="more" type="button">+10 people</button>
      <button id="fewer" type="button">Clear</button>
      <button id="mute" type="button" aria-label="Sound on or off">🔊</button>
      <button id="check-update" type="button" aria-label="Check for update">⟳</button>
    </div>
  </div>
  <div id="hint">Drag anywhere to walk · WASD / arrows on a keyboard</div>
  <button id="action" type="button" hidden></button>
  <div id="toast" role="status"></div>
  <div id="place" class="modal" hidden>
    <div class="card" role="dialog" aria-labelledby="place-title">
      <h2 id="place-title"></h2>
      <p id="place-text"></p>
      <div id="place-menu" class="menu"></div>
      <div class="row"><button id="place-close" type="button">Leave</button></div>
    </div>
  </div>
  <div id="update" hidden>
    <div class="card" role="dialog" aria-labelledby="update-title">
      <h2 id="update-title">New version ready!</h2>
      <p>An update to Nico's City has downloaded. Restart to play it.</p>
      <div class="row">
        <button id="update-later" type="button">Later</button>
        <button id="update-restart" type="button" class="primary">Restart</button>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
